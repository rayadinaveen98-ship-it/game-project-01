name: Snapline P6.2 — Contextual Guide Regression
on:
  pull_request:
    paths:
      - 'prototypes/snapline/pulse-grid/**'
      - '.github/workflows/snapline-p62.yml'
  push:
    paths:
      - 'prototypes/snapline/pulse-grid/**'
      - '.github/workflows/snapline-p62.yml'
jobs:
  p62-onboarding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: prototypes/snapline/pulse-grid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --no-audit --no-fund
      - name: Compile and run all regression/onboarding tests
        run: npm run check
      - name: Rebuild self-contained HTML
        run: node scripts/make-single-html.mjs
      - name: Verify reproducible offline build
        run: git diff --exit-code -- standalone.html
      - name: Verify mode-specific guide controls
        run: |
          grep -q 'id="guideSteps"' standalone.html
          grep -q 'id="skipHowto"' standalone.html
          grep -q 'id="courseGuideBtn"' standalone.html
          grep -q 'snapline-pulse-mode-guides-v1' standalone.html
          grep -q 'snapline-pulse-progress-v1' standalone.html
      - uses: actions/upload-artifact@v4
        with:
          name: snapline-p62-three-mode-guides
          path: prototypes/snapline/pulse-grid/standalone.html
          if-no-files-found: error
