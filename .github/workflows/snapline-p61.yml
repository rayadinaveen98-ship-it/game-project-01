name: Snapline P6.1 — Catalog and Progress QA
on:
  pull_request:
    paths:
      - 'prototypes/snapline/pulse-grid/**'
      - '.github/workflows/snapline-p61.yml'
  push:
    paths:
      - 'prototypes/snapline/pulse-grid/**'
      - '.github/workflows/snapline-p61.yml'
jobs:
  p61-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: prototypes/snapline/pulse-grid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --no-audit --no-fund
      - name: Compile and run all 34 simulation/catalog/progress tests
        run: npm run check
      - name: Rebuild offline HTML deterministically
        run: node scripts/make-single-html.mjs
      - name: Verify committed standalone equals generated file
        run: git diff --exit-code -- standalone.html
      - name: Verify mode selector, course screen, progress controls
        run: |
          grep -q 'id="courseScreen"' standalone.html
          grep -q 'id="resetProgress"' standalone.html
          grep -q 'snapline-pulse-progress-v1' standalone.html
      - uses: actions/upload-artifact@v4
        with:
          name: snapline-p61-three-mode-prototype
          path: prototypes/snapline/pulse-grid/standalone.html
          if-no-files-found: error
